database:
  url: "postgres://postgres:postgres@postgres:5432/blobindexer?sslmode=disable"

server:
  port: 8080
  dev_mode: true

logging:
  level: "info"
  format: "json"

indexer:
  version: "dev"
  batch_size: 100
  polling_interval: 15s
  mempool_polling_interval: 30s

networks:
  - name: "sepolia"
    chain_id: 11155111
    rpc_url: "wss://sepolia-geth-ws.ahkc.win"
    start_block: "LATEST-1000"
    enabled: true
