# Test values for chart-testing (ct install / helm test)
# Deploys the API against in-cluster PostgreSQL without running the indexer.
# The RPC URL is unused while indexer.enabled=false.

image:
  registry: ""
  repository: blob-indexer-api
  pullPolicy: Never
  tag: "test"

api:
  replicaCount: 1
  image:
    repository: blob-indexer-api

indexer:
  enabled: false
  replicaCount: 1
  image:
    repository: blob-indexer-indexer
    tag: "test"

ingress:
  enabled: false

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

appConfig:
  database:
    url: "postgres://testuser:testpass@blob-indexer-postgresql.default.svc.cluster.local:5432/blobindexer?sslmode=disable"
  server:
    port: 8080
    dev_mode: true
  logging:
    level: "debug"
    format: "json"
  indexer:
    version: "test"
    batch_size: 10
    polling_interval: "15s"
    mempool_polling_interval: "60s"
  attribution:
    blob_list_enabled: true
    blob_list_base_url: "https://raw.githubusercontent.com/ahkc4/blob-list/main/artifacts/by-chain"
    blob_list_refresh_interval: "1h"
    blob_list_request_timeout: "10s"
  networks:
    - name: "sepolia"
      chain_id: 11155111
      rpc_url: ""  # Set via --set in CI/Makefile
      start_block: "LATEST-10"
      enabled: true

# The test image is built from this branch, which predates the dedicated
# /api/v1/healthz and /api/v1/readyz endpoints (added by a sibling app PR).
# Point the probes at the always-present /api/v1/status so ct install can reach
# readiness. Production installs use the dedicated endpoints from values.yaml.
healthCheck:
  path: /api/v1/status
  livenessPath: /api/v1/status
  readinessPath: /api/v1/status
  initialDelaySeconds: 15
  periodSeconds: 5
