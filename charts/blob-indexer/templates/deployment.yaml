apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "blob-indexer.fullname" . }}-api
  labels:
    {{- include "blob-indexer.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount | default .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "blob-indexer.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "blob-indexer.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
      annotations:
        {{- if .Values.configMap.create }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- if .Values.databaseSecret.create }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- if include "blob-indexer.createRpcSecret" . }}
        checksum/rpc-secret: {{ include (print $.Template.BasePath "/rpc-secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "blob-indexer.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}-api
          image: "{{ include "blob-indexer.image" (list . .Values.api.image) }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.appConfig.server.port }}
              protocol: TCP
            {{- if .Values.appConfig.server.dev_port }}
            - name: dev-http
              containerPort: {{ .Values.appConfig.server.dev_port }}
              protocol: TCP
            {{- end }}
          env:
            - name: CONFIG_PATH
              value: /etc/config/config.yaml
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "blob-indexer.applicationDatabaseSecretName" . }}
                  key: {{ include "blob-indexer.applicationDatabaseSecretKey" . }}
            {{- include "blob-indexer.rpcEnv" . | nindent 12 }}
          volumeMounts:
            - name: config-volume
              mountPath: /etc/config
          livenessProbe:
            httpGet:
              {{- /* Liveness must not depend on the database: /api/v1/healthz is a
                     pure-process check so DB blips don't trigger restart storms. */}}
              path: {{ .Values.healthCheck.livenessPath | default .Values.healthCheck.path }}
              port: http
            initialDelaySeconds: {{ .Values.healthCheck.initialDelaySeconds }}
            periodSeconds: {{ .Values.healthCheck.periodSeconds }}
          readinessProbe:
            httpGet:
              {{- /* Readiness pings the DB (/api/v1/readyz) so traffic only
                     reaches pods that can actually serve queries. */}}
              path: {{ .Values.healthCheck.readinessPath | default .Values.healthCheck.path }}
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml (.Values.api.resources | default .Values.resources) | nindent 12 }}
      volumes:
        - name: config-volume
          configMap:
            name: {{ include "blob-indexer.fullname" . }}-config
