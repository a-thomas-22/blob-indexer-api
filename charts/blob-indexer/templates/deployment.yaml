apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "blob-indexer.fullname" . }}
  labels:
    {{- include "blob-indexer.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "blob-indexer.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "blob-indexer.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: DB_URL
              value: "postgres://{{ .Values.postgresql.auth.username }}:{{ .Values.postgresql.auth.password }}@chart-postgresql:5432/{{ .Values.postgresql.auth.database }}?sslmode=disable"
            - name: RPC_URL
              value: {{ .Values.blobIndexer.ethRpcUrl | quote }}
            - name: START_BLOCK
              value: {{ .Values.blobIndexer.startBlock | quote }}
            - name: INDEXER_VERSION
              value: {{ .Values.blobIndexer.indexerVersion | quote }}
            - name: DEV_MODE
              value: {{ .Values.blobIndexer.devMode | quote }}
            - name: PORT
              value: "8080"
          livenessProbe:
            httpGet:
              path: /api/status
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/status
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
