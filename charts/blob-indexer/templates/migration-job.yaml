{{- if .Values.migrations.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "blob-indexer.fullname" . }}-migrate
  labels:
    {{- include "blob-indexer.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    # Argo CD ignores all helm.sh/hook* annotations once any
    # argocd.argoproj.io/hook annotation is present, so the three below fully
    # define hook behavior under Argo CD (plain Helm ignores them). Without
    # them Argo maps the Helm annotations to BeforeHookCreation, and a sync
    # retry deletes a still-RUNNING migration Job — killing the migration
    # mid-flight and leaving golang-migrate's dirty flag set (2026-06-11
    # incident). With HookSucceeded,HookFailed a retry instead fails fast on
    # "job already exists" while the migration keeps running, and finished
    # jobs are cleaned up so the next sync starts fresh.
    "argocd.argoproj.io/hook": PreSync
    "argocd.argoproj.io/sync-wave": "-5"
    "argocd.argoproj.io/hook-delete-policy": HookSucceeded,HookFailed
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "blob-indexer.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: OnFailure
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: "{{ include "blob-indexer.image" (list . .Values.api.image) }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - ./blob-indexer-migrate
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: DB_URL
              {{- if include "blob-indexer.useMigrationDatabaseSecret" . }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "blob-indexer.databaseSecretName" . }}
                  key: {{ include "blob-indexer.databaseSecretKey" . }}
              {{- else }}
              value: {{ include "blob-indexer.migrationDatabaseURL" . | quote }}
              {{- end }}
            - name: LOG_LEVEL
              value: {{ .Values.appConfig.logging.level | quote }}
            - name: LOG_FORMAT
              value: {{ .Values.appConfig.logging.format | quote }}
          resources:
            {{- toYaml (.Values.api.resources | default .Values.resources) | nindent 12 }}
{{- end }}
