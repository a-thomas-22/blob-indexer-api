{{- if .Values.migrations.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "blob-indexer.fullname" . }}-migrate
  labels:
    {{- include "blob-indexer.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "blob-indexer.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: OnFailure
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: "{{ include "blob-indexer.image" (list . .Values.api.image) }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - ./blob-indexer-migrate
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "blob-indexer.databaseSecretName" . }}
                  key: {{ include "blob-indexer.databaseSecretKey" . }}
            - name: LOG_LEVEL
              value: {{ .Values.appConfig.logging.level | quote }}
            - name: LOG_FORMAT
              value: {{ .Values.appConfig.logging.format | quote }}
          resources:
            {{- toYaml (.Values.api.resources | default .Values.resources) | nindent 12 }}
{{- end }}
