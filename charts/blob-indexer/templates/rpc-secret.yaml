{{- if include "blob-indexer.createRpcSecret" . }}
{{/*
Chart-managed Secret holding per-network RPC URLs (which embed provider API
keys). RPC URLs must never be rendered into the credential-free ConfigMap; the
indexer (and API) read them from this Secret via NETWORK_<NAME>_RPC_URL env vars.

For non-local installs prefer rpcSecret.existingSecret so the credential is
provisioned out-of-band (sealed-secrets, external-secrets, vault, etc.) and is
never passed through Helm values or stored in release history.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "blob-indexer.rpcSecretName" . }}
  labels:
    {{- include "blob-indexer.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range .Values.appConfig.networks }}
  {{- if .rpc_url }}
  {{ include "blob-indexer.rpcEnvName" .name }}: {{ .rpc_url | quote }}
  {{- end }}
  {{- end }}
{{- end }}
