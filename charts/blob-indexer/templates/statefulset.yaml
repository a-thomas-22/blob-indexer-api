{{- if .Values.indexer.enabled }}
{{/*
The indexer runs as a StatefulSet purely for identity/ordering semantics: it is
a single-writer process per network, and StatefulSet rollouts delete a pod
before creating its replacement, so two indexers never write concurrently.
State lives in PostgreSQL, so no volumeClaimTemplates are needed. The headless
Service below exists only to satisfy the StatefulSet serviceName requirement.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "blob-indexer.fullname" . }}-indexer
  labels:
    {{- include "blob-indexer.labels" . | nindent 4 }}
    app.kubernetes.io/component: indexer
spec:
  clusterIP: None
  selector:
    {{- include "blob-indexer.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: indexer
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "blob-indexer.fullname" . }}-indexer
  labels:
    {{- include "blob-indexer.labels" . | nindent 4 }}
    app.kubernetes.io/component: indexer
spec:
  serviceName: {{ include "blob-indexer.fullname" . }}-indexer
  replicas: {{ .Values.indexer.replicaCount | default 1 }}
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "blob-indexer.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: indexer
  template:
    metadata:
      labels:
        {{- include "blob-indexer.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: indexer
      annotations:
        {{- if .Values.configMap.create }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- if .Values.databaseSecret.create }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "blob-indexer.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}-indexer
          image: "{{ include "blob-indexer.image" (list . .Values.indexer.image) }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: CONFIG_PATH
              value: /etc/config/config.yaml
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "blob-indexer.applicationDatabaseSecretName" . }}
                  key: {{ include "blob-indexer.applicationDatabaseSecretKey" . }}
          volumeMounts:
            - name: config-volume
              mountPath: /etc/config
          resources:
            {{- toYaml (.Values.indexer.resources | default .Values.resources) | nindent 12 }}
      volumes:
        - name: config-volume
          configMap:
            name: {{ include "blob-indexer.fullname" . }}-config
{{- end }}
