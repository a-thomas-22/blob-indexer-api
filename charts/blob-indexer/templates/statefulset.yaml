{{- if .Values.indexer.enabled }}
{{/*
The indexer runs as a StatefulSet purely for identity/ordering semantics: it is
a single-writer process per network, and StatefulSet rollouts delete a pod
before creating its replacement, so two indexers never write concurrently.
State lives in PostgreSQL, so no volumeClaimTemplates are needed. The headless
Service below exists only to satisfy the StatefulSet serviceName requirement.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "blob-indexer.fullname" . }}-indexer
  labels:
    {{- include "blob-indexer.labels" . | nindent 4 }}
    app.kubernetes.io/component: indexer
spec:
  clusterIP: None
  selector:
    {{- include "blob-indexer.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: indexer
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "blob-indexer.fullname" . }}-indexer
  labels:
    {{- include "blob-indexer.labels" . | nindent 4 }}
    app.kubernetes.io/component: indexer
spec:
  serviceName: {{ include "blob-indexer.fullname" . }}-indexer
  replicas: {{ .Values.indexer.replicaCount | default 1 }}
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "blob-indexer.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: indexer
  template:
    metadata:
      labels:
        {{- include "blob-indexer.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: indexer
      annotations:
        {{- if .Values.configMap.create }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- if .Values.databaseSecret.create }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- if include "blob-indexer.createRpcSecret" . }}
        checksum/rpc-secret: {{ include (print $.Template.BasePath "/rpc-secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "blob-indexer.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}-indexer
          image: "{{ include "blob-indexer.image" (list . .Values.indexer.image) }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: CONFIG_PATH
              value: /etc/config/config.yaml
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "blob-indexer.applicationDatabaseSecretName" . }}
                  key: {{ include "blob-indexer.applicationDatabaseSecretKey" . }}
            {{- include "blob-indexer.rpcEnv" . | nindent 12 }}
          volumeMounts:
            - name: config-volume
              mountPath: /etc/config
            {{- if .Values.indexer.livenessProbe.enabled }}
            - name: indexer-heartbeat
              mountPath: /var/run/indexer
            {{- end }}
          {{- with .Values.indexer.livenessProbe }}
          {{- if .enabled }}
          livenessProbe:
            {{- /*
              Deliberately RPC-independent: a liveness probe that pinged the
              upstream provider would trigger restart storms during provider
              outages. The default exec probe checks a heartbeat file the
              process is expected to refresh. The indexer binary does not yet
              write this file, so the probe is disabled by default.
              TODO(indexer-liveness): enable once the indexer writes
              `indexer.heartbeatPath` (or exposes a local health port) and flip
              indexer.livenessProbe.enabled to true.
            */}}
            exec:
              command:
                - /bin/sh
                - -c
                - >-
                  test -f {{ .heartbeatPath | quote }} &&
                  test "$(( $(date +%s) - $(stat -c %Y {{ .heartbeatPath | quote }}) ))"
                  -lt {{ .maxStaleSeconds | int }}
            initialDelaySeconds: {{ .initialDelaySeconds }}
            periodSeconds: {{ .periodSeconds }}
            timeoutSeconds: {{ .timeoutSeconds }}
            failureThreshold: {{ .failureThreshold }}
          {{- end }}
          {{- end }}
          resources:
            {{- toYaml (.Values.indexer.resources | default .Values.resources) | nindent 12 }}
      volumes:
        - name: config-volume
          configMap:
            name: {{ include "blob-indexer.fullname" . }}-config
        {{- if .Values.indexer.livenessProbe.enabled }}
        # Writable scratch volume for the liveness heartbeat file. Required
        # because the pod runs with readOnlyRootFilesystem: true, so the
        # heartbeat path must live on a mounted writable volume.
        - name: indexer-heartbeat
          emptyDir: {}
        {{- end }}
{{- end }}
