{{- if .Values.configMap.create }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "blob-indexer.fullname" . }}-config
  labels:
    {{- include "blob-indexer.labels" . | nindent 4 }}
data:
  config.yaml: |
    database:
      url: ""
      run_migrations: {{ .Values.appConfig.database.run_migrations | default false }}
      schema_wait_timeout: {{ .Values.appConfig.database.schema_wait_timeout | quote }}
      schema_poll_interval: {{ .Values.appConfig.database.schema_poll_interval | quote }}
    server:
      port: {{ .Values.appConfig.server.port }}
      dev_port: {{ .Values.appConfig.server.dev_port | default 0 }}
      dev_mode: {{ .Values.appConfig.server.dev_mode }}
      trusted_ip_headers:
        {{- toYaml .Values.appConfig.server.trusted_ip_headers | nindent 8 }}
      rate_limit_rps: {{ .Values.appConfig.server.rate_limit_rps | default 100 }}
      rate_limit_burst: {{ .Values.appConfig.server.rate_limit_burst | default 200 }}
      aggregate_rate_limit_rps: {{ .Values.appConfig.server.aggregate_rate_limit_rps | default 5 }}
      aggregate_rate_limit_burst: {{ .Values.appConfig.server.aggregate_rate_limit_burst | default 20 }}
    cors:
      enabled: {{ .Values.appConfig.cors.enabled }}
      allowed_origins:
        {{- toYaml .Values.appConfig.cors.allowed_origins | nindent 8 }}
      allowed_origin_patterns:
        {{- toYaml .Values.appConfig.cors.allowed_origin_patterns | nindent 8 }}
      allow_all_origins: {{ .Values.appConfig.cors.allow_all_origins }}
      allowed_methods:
        {{- toYaml .Values.appConfig.cors.allowed_methods | nindent 8 }}
      allowed_headers:
        {{- toYaml .Values.appConfig.cors.allowed_headers | nindent 8 }}
      exposed_headers:
        {{- toYaml .Values.appConfig.cors.exposed_headers | nindent 8 }}
      allow_credentials: {{ .Values.appConfig.cors.allow_credentials }}
      max_age_seconds: {{ .Values.appConfig.cors.max_age_seconds }}
    logging:
      level: {{ .Values.appConfig.logging.level | quote }}
      format: {{ .Values.appConfig.logging.format | quote }}
    indexer:
      version: {{ .Values.appConfig.indexer.version | quote }}
      batch_size: {{ .Values.appConfig.indexer.batch_size }}
      polling_interval: {{ .Values.appConfig.indexer.polling_interval | quote }}
      mempool_polling_interval: {{ .Values.appConfig.indexer.mempool_polling_interval | quote }}
      mempool_ttl: {{ .Values.appConfig.indexer.mempool_ttl | quote }}
      mempool_cleanup_interval: {{ .Values.appConfig.indexer.mempool_cleanup_interval | quote }}
      worker_count: {{ .Values.appConfig.indexer.worker_count }}
      max_block_retries: {{ .Values.appConfig.indexer.max_block_retries }}
      gap_scan_interval: {{ .Values.appConfig.indexer.gap_scan_interval | quote }}
      max_reorg_depth: {{ .Values.appConfig.indexer.max_reorg_depth }}
      startup_gap_scan_blocks: {{ .Values.appConfig.indexer.startup_gap_scan_blocks }}
      rpc_rate_limit: {{ .Values.appConfig.indexer.rpc_rate_limit }}
      priority_fee_backfill_enabled: {{ .Values.appConfig.indexer.priority_fee_backfill_enabled }}
      priority_fee_backfill_pause: {{ .Values.appConfig.indexer.priority_fee_backfill_pause | quote }}
    attribution:
      blob_list_enabled: {{ .Values.appConfig.attribution.blob_list_enabled }}
      blob_list_base_url: {{ .Values.appConfig.attribution.blob_list_base_url | quote }}
      blob_list_refresh_interval: {{ .Values.appConfig.attribution.blob_list_refresh_interval | quote }}
      blob_list_request_timeout: {{ .Values.appConfig.attribution.blob_list_request_timeout | quote }}
    {{- with .Values.appConfig.mcp }}
    mcp:
      enabled: {{ .enabled | default false }}
      path: {{ .path | default "/mcp" | quote }}
      rate_limit_rps: {{ .rate_limit_rps | default 10 }}
      rate_limit_burst: {{ .rate_limit_burst | default 30 }}
      {{- /*
        Key entries are permission declarations only: render an explicit
        allowlist of fields (name, tools) so no spelling of a secret field
        (key, Key, KEY, ...) can reach the ConfigMap. Viper lowercases keys on
        load, so a stray "Key:" WOULD otherwise be honored as the secret. The
        secret arrives via MCP_API_KEYS (see mcp-secret.yaml / mcpSecret).
      */}}
      keys:
        {{- if .keys }}
        {{- range .keys }}
        {{- $entry := . }}
        {{- range $field, $_ := $entry }}
        {{- /*
          Exact spellings only. Matching case-insensitively here while the
          renderer below reads only ".tools" would let a "Tools:" typo through
          as an empty allowlist, which the app reads as "every tool" — a
          silent widening of access instead of a loud failure.
        */}}
        {{- if not (has $field (list "name" "tools")) }}
        {{- fail (printf "appConfig.mcp.keys[] entry %q has field %q; only the exact fields name and tools are allowed here (secrets go in mcpSecret)" (toString $entry.name) $field) }}
        {{- end }}
        {{- end }}
        - name: {{ required "appConfig.mcp.keys[].name is required" .name | quote }}
          {{- if .tools }}
          tools:
            {{- toYaml .tools | nindent 12 }}
          {{- else }}
          tools: []
          {{- end }}
        {{- end }}
        {{- else }}
        []
        {{- end }}
    {{- end }}
    {{- if .Values.appConfig.networks }}
    networks:
      {{- /*
        rpc_url is intentionally stripped here: it embeds a provider API key and
        is injected at runtime as NETWORK_<NAME>_RPC_URL from a Secret (see
        rpc-secret.yaml). Every other field is preserved verbatim (and with its
        original type) so the ConfigMap stays credential-free without dropping
        config. rpc_url is re-emitted as "" so the app's empty-string default is
        explicit.
      */}}
      {{- range .Values.appConfig.networks }}
      {{- $network := omit . "rpc_url" }}
      {{- $_ := set $network "rpc_url" "" }}
      - {{ toYaml $network | nindent 8 | trim }}
      {{- end }}
    {{- end }}
{{- end }}
