{{- if .Values.configMap.create }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "blob-indexer.fullname" . }}-config
  labels:
    {{- include "blob-indexer.labels" . | nindent 4 }}
data:
  config.yaml: |
    database:
      url: ""
      run_migrations: {{ .Values.appConfig.database.run_migrations | default false }}
      schema_wait_timeout: {{ .Values.appConfig.database.schema_wait_timeout | quote }}
      schema_poll_interval: {{ .Values.appConfig.database.schema_poll_interval | quote }}
    server:
      port: {{ .Values.appConfig.server.port }}
      dev_port: {{ .Values.appConfig.server.dev_port | default 0 }}
      dev_mode: {{ .Values.appConfig.server.dev_mode }}
    cors:
      enabled: {{ .Values.appConfig.cors.enabled }}
      allowed_origins:
        {{- toYaml .Values.appConfig.cors.allowed_origins | nindent 8 }}
      allowed_origin_patterns:
        {{- toYaml .Values.appConfig.cors.allowed_origin_patterns | nindent 8 }}
      allow_all_origins: {{ .Values.appConfig.cors.allow_all_origins }}
      allowed_methods:
        {{- toYaml .Values.appConfig.cors.allowed_methods | nindent 8 }}
      allowed_headers:
        {{- toYaml .Values.appConfig.cors.allowed_headers | nindent 8 }}
      exposed_headers:
        {{- toYaml .Values.appConfig.cors.exposed_headers | nindent 8 }}
      allow_credentials: {{ .Values.appConfig.cors.allow_credentials }}
      max_age_seconds: {{ .Values.appConfig.cors.max_age_seconds }}
    logging:
      level: {{ .Values.appConfig.logging.level | quote }}
      format: {{ .Values.appConfig.logging.format | quote }}
    indexer:
      version: {{ .Values.appConfig.indexer.version | quote }}
      batch_size: {{ .Values.appConfig.indexer.batch_size }}
      polling_interval: {{ .Values.appConfig.indexer.polling_interval }}
      mempool_polling_interval: {{ .Values.appConfig.indexer.mempool_polling_interval }}
    attribution:
      blob_list_enabled: {{ .Values.appConfig.attribution.blob_list_enabled }}
      blob_list_base_url: {{ .Values.appConfig.attribution.blob_list_base_url | quote }}
      blob_list_refresh_interval: {{ .Values.appConfig.attribution.blob_list_refresh_interval | quote }}
      blob_list_request_timeout: {{ .Values.appConfig.attribution.blob_list_request_timeout | quote }}
    {{- if .Values.appConfig.networks }}
    networks:
      {{- toYaml .Values.appConfig.networks | nindent 6 }}
    {{- end }}
{{- end }}
