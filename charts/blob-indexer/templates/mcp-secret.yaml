{{- if include "blob-indexer.createMcpSecret" . }}
{{/*
Chart-managed Secret holding the MCP API keys ("name:secret,..."). For
non-local installs prefer mcpSecret.existingSecret so the credential is
provisioned out-of-band and never passes through Helm values or release
history. The permission model (key names and tool allowlists) lives in the
ConfigMap; only the secrets live here.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "blob-indexer.mcpSecretName" . }}
  labels:
    {{- include "blob-indexer.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.mcpSecret.key | default "MCP_API_KEYS" }}: {{ .Values.mcpSecret.apiKeys | quote }}
{{- end }}
