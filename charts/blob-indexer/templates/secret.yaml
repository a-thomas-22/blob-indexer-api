{{- if .Values.databaseSecret.create }}
{{- $dbURL := .Values.appConfig.database.url -}}
{{- if .Values.externalDatabase.url -}}
{{- $dbURL = .Values.externalDatabase.url -}}
{{- else if .Values.postgresql.enabled -}}
{{- if not .Values.postgresql.auth.username -}}{{ fail "postgresql.auth.username must be set when postgresql.enabled is true" }}{{- end -}}
{{- if not .Values.postgresql.auth.password -}}{{ fail "postgresql.auth.password must be set when postgresql.enabled is true" }}{{- end -}}
{{- if not .Values.postgresql.auth.database -}}{{ fail "postgresql.auth.database must be set when postgresql.enabled is true" }}{{- end -}}
{{- $dbURL = printf "postgres://%s:%s@%s-postgresql:5432/%s?sslmode=disable" .Values.postgresql.auth.username .Values.postgresql.auth.password .Release.Name .Values.postgresql.auth.database -}}
{{- end -}}
{{- if not $dbURL -}}{{ fail "A database URL must be provided. Set postgresql.enabled=true with auth values, externalDatabase.url, or appConfig.database.url." }}{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "blob-indexer.fullname" . }}-db
  labels:
    {{- include "blob-indexer.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_URL: {{ $dbURL | quote }}
{{- end }}
