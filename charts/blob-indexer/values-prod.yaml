# Production values for blob-indexer
replicaCount: 1

api:
  replicaCount: 2

indexer:
  replicaCount: 1

image:
  repository: ghcr.io/a-thomas-22/blob-indexer-api-api
  pullPolicy: Always
  tag: ""  # Set via --set image.tag=<sha> in CI

api:
  image:
    repository: ghcr.io/a-thomas-22/blob-indexer-api-api

indexer:
  image:
    repository: ghcr.io/a-thomas-22/blob-indexer-api-indexer

resources:
  limits:
    cpu: "2"
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 512Mi

appConfig:
  database:
    url: ""  # Set via --set appConfig.database.url=...
  server:
    dev_mode: false
  logging:
    level: "warn"
  indexer:
    version: "v1.0.0"
    batch_size: 500
    polling_interval: "15s"
    mempool_polling_interval: "30s"
  networks:
    - name: "mainnet"
      chain_id: 1
      rpc_url: ""  # Set via --set appConfig.networks[0].rpc_url=...
      start_block: "LATEST-1000"
      enabled: true

healthCheck:
  path: /api/v1/status
  initialDelaySeconds: 60
  periodSeconds: 15
