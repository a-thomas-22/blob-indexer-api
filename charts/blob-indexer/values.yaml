# Default values for blob-indexer (production defaults)
replicaCount: 1

image:
  repository: blob-indexer-api
  pullPolicy: IfNotPresent
  tag: "latest"

# Per-component overrides (image, replicas, resources).
# Falls back to top-level values when not set.
api:
  replicaCount: 1
  image: {}
  resources: {}

indexer:
  replicaCount: 1
  image: {}
  resources: {}

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: "nginx"
  annotations: {}
  hosts:
    - host: blob-indexer.localhost
      paths:
        - path: /
          pathType: Prefix

resources:
  limits:
    cpu: "1"
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 256Mi

podSecurityContext:
  # Enforce that containers do not run as root. When overriding images, ensure
  # that the image uses a non-root UID, otherwise the pod will fail to start.
  # If your image runs as a specific non-root user/group, you can explicitly
  # set runAsUser/runAsGroup here, for example:
  #
  #   runAsUser: 1000
  #   runAsGroup: 1000
  #
  # Adjust the above UID/GID to match your image if you choose to enable them.
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

serviceAccount:
  create: true
  name: ""
  automountServiceAccountToken: false

networkPolicy:
  enabled: true
  dbPort: 5432

# ConfigMap creation toggle. Set to false when config is managed externally (e.g., Tilt).
configMap:
  create: true

# Database Secret creation toggle.
databaseSecret:
  create: true

# Database security settings for constructed URLs.
database:
  sslMode: require

migrations:
  enabled: true


# Application configuration -- rendered into a ConfigMap as YAML.
# Maps directly to the Config struct in internal/config/config.go.
appConfig:
  database:
    url: ""  # Set via externalDatabase.url or auto-constructed from postgresql.* values
    run_migrations: false
  server:
    port: 8080
    dev_mode: false
  logging:
    level: "info"
    format: "json"
  indexer:
    version: "v1.0.0"
    batch_size: 100
    polling_interval: "15s"
    mempool_polling_interval: "30s"
  networks: []
    # - name: "mainnet"
    #   chain_id: 1
    #   rpc_url: "https://mainnet.infura.io/v3/YOUR-KEY"
    #   start_block: "LATEST-1000"
    #   enabled: true

# External database URL (used when postgresql.enabled is false)
externalDatabase:
  url: ""

# PostgreSQL subchart configuration
postgresql:
  enabled: true
  auth:
    username: blobdev
    password: blobdev
    database: blobindexer
  primary:
    persistence:
      size: 1Gi

# Health check configuration
healthCheck:
  path: /api/v1/status
  initialDelaySeconds: 30
  periodSeconds: 10

# Pod annotations
podAnnotations: {}

nameOverride: ""
fullnameOverride: ""
