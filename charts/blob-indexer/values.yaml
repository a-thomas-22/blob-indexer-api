# Default values for blob-indexer (production defaults)
replicaCount: 1

image:
  registry: registry.ahkc.win/public
  repository: blob-indexer-api-api
  pullPolicy: Always
  tag: ""  # Defaults to Chart.appVersion when unset.

# Per-component overrides (image, replicas, resources).
# Falls back to top-level values when not set.
api:
  replicaCount: 2
  image:
    repository: blob-indexer-api-api
  resources: {}

# The indexer runs as a StatefulSet (no PVCs; state lives in PostgreSQL) so
# rollouts replace pods delete-before-create — at most one indexer per ordinal
# writes at a time. Keep replicaCount at 1 unless running one indexer per network.
indexer:
  enabled: true
  replicaCount: 1
  image:
    repository: blob-indexer-api-indexer
  resources: {}
  # Indexer liveness probe. Deliberately RPC-independent so that an upstream
  # provider outage does not trigger a restart storm. The probe checks a
  # heartbeat file that the indexer process is expected to refresh.
  #
  # The indexer binary does not yet write this heartbeat file, so the probe is
  # DISABLED by default. Enable it only once the process refreshes heartbeatPath
  # (or a local health endpoint is wired up). See statefulset.yaml TODO.
  livenessProbe:
    enabled: false
    # Must live on a writable mounted volume: the pod runs with a read-only root
    # filesystem, so when this probe is enabled the chart mounts an emptyDir at
    # /var/run/indexer to hold the heartbeat file.
    heartbeatPath: /var/run/indexer/heartbeat
    # Restart only if the heartbeat is older than this many seconds.
    maxStaleSeconds: 300
    initialDelaySeconds: 120
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 6

service:
  type: ClusterIP
  port: 8080

devService:
  enabled: false
  type: ClusterIP
  port: 8081

ingress:
  enabled: false
  className: "nginx"
  annotations: {}
  hosts:
    - host: blob-indexer.localhost
      paths:
        - path: /
          pathType: Prefix

resources:
  limits:
    cpu: "2"
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 512Mi

podSecurityContext:
  # Enforce that containers do not run as root. When overriding images, ensure
  # that the image uses a non-root UID, otherwise the pod will fail to start.
  # If your image runs as a specific non-root user/group, you can explicitly
  # set runAsUser/runAsGroup here, for example:
  #
  #   runAsUser: 1000
  #   runAsGroup: 1000
  #
  # Adjust the above UID/GID to match your image if you choose to enable them.
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

serviceAccount:
  create: true
  name: ""
  automountServiceAccountToken: false

# ConfigMap creation toggle. Set to false when config is managed externally (e.g., Tilt).
configMap:
  create: true

# Database Secret configuration. When create is true, set appConfig.database.url
# or externalDatabase.url. When create is false, provide this Secret outside the
# chart, defaulting to <release fullname>-db when name is unset.
databaseSecret:
  create: true
  name: ""
  key: DB_URL

migrations:
  enabled: true
  databaseSecret:
    name: ""
    key: ""  # Defaults to databaseSecret.key.

# Per-network RPC URL Secret. RPC URLs embed a provider API key (Alchemy,
# Infura, ...) and MUST be treated as credentials — never put them in the
# credential-free ConfigMap.
#
# The chart injects each network's RPC URL as an env var
# NETWORK_<NAME>_RPC_URL (uppercased network name) sourced from a Kubernetes
# Secret via secretKeyRef. The application reads these overrides
# (see internal/config/config.go).
#
# Two ways to supply the Secret:
#   1. existingSecret (RECOMMENDED for prod): provision the Secret out-of-band
#      (sealed-secrets / external-secrets / vault) with one key per network,
#      named exactly NETWORK_<UPPER(name)>_RPC_URL, then set:
#        rpcSecret.existingSecret: my-rpc-secret
#      Do NOT set appConfig.networks[].rpc_url in this case.
#   2. Chart-managed (local/dev only): set appConfig.networks[].rpc_url and the
#      chart renders a Secret for you. WARNING: this stores the credential in
#      Helm release history and any values file — acceptable for local dev,
#      NOT for shared/non-local installs.
#
# The env var / Secret key is "NETWORK_<UPPER(name)>_RPC_URL", matching the app's
# lookup byte-for-byte (no character substitution). Network names must use only
# characters valid in an env var name / Secret key ([A-Za-z0-9_.-]).
rpcSecret:
  # Name of a pre-provisioned Secret holding NETWORK_<NAME>_RPC_URL keys. When
  # set, the chart renders no Secret and ignores appConfig.networks[].rpc_url.
  existingSecret: ""
  # Override the chart-managed Secret name (defaults to "<fullname>-rpc").
  name: ""

# Application configuration -- rendered into a ConfigMap as YAML.
# Maps directly to the Config struct in internal/config/config.go.
appConfig:
  database:
    url: ""  # PostgreSQL connection string; can also be set via externalDatabase.url
    run_migrations: false
    schema_wait_timeout: "2m"
    schema_poll_interval: "2s"
  server:
    port: 8080
    dev_port: 0
    dev_mode: false
    # Enable when the API is only reachable through trusted proxies.
    # For Cloudflare, use:
    # trusted_ip_headers:
    #   - CF-Connecting-IP
    trusted_ip_headers: []
    rate_limit_rps: 100
    rate_limit_burst: 200
    aggregate_rate_limit_rps: 5
    aggregate_rate_limit_burst: 20
  cors:
    enabled: true
    allowed_origins:
      - "http://localhost:3000"
      - "http://localhost:3001"
      - "http://127.0.0.1:3000"
      - "http://127.0.0.1:3001"
    allowed_origin_patterns: []
    allow_all_origins: false
    allowed_methods:
      - "GET"
      - "OPTIONS"
    allowed_headers:
      - "Accept"
      - "Content-Type"
      - "Authorization"
    exposed_headers:
      - "Content-Length"
      - "ETag"
    allow_credentials: false
    max_age_seconds: 86400
  logging:
    level: "warn"
    format: "json"
  indexer:
    version: "v1.0.0"
    batch_size: 500
    polling_interval: "15s"
    mempool_polling_interval: "30s"
  attribution:
    blob_list_enabled: true
    blob_list_base_url: "https://raw.githubusercontent.com/ahkc4/blob-list/main/artifacts/by-chain"
    blob_list_refresh_interval: "1h"
    blob_list_request_timeout: "10s"
  networks:
    - name: "mainnet"
      chain_id: 1
      # SECURITY: rpc_url is a credential (it embeds a provider API key). For
      # non-local installs leave it empty and provide it via
      # rpcSecret.existingSecret instead — setting it here renders a
      # chart-managed Secret and persists the key in Helm release history. It is
      # NEVER written to the ConfigMap.
      rpc_url: ""
      start_block: "LATEST-1000"
      enabled: true

# External database URL. Prefer appConfig.database.url for new installs.
externalDatabase:
  url: ""

# API health check configuration.
#   path          — endpoint used by both probes when livenessPath/readinessPath
#                   are unset (the default).
#   livenessPath  — should NOT touch the database (a DB blip must not restart the
#                   pod). Once the app image exposes /api/v1/healthz (no DB), set
#                   this to /api/v1/healthz.
#   readinessPath — should ping the database so traffic only reaches pods that
#                   can serve queries. Once the app image exposes /api/v1/readyz
#                   (DB ping), set this to /api/v1/readyz.
# Defaults are intentionally empty so both probes fall back to `path`
# (/api/v1/status), keeping the chart compatible with app images that predate
# the dedicated health endpoints. Flip them in a release coordinated with the
# app version that adds /healthz + /readyz.
healthCheck:
  path: /api/v1/status
  livenessPath: ""
  readinessPath: ""
  initialDelaySeconds: 60
  periodSeconds: 15

# Pod annotations
podAnnotations: {}

nameOverride: ""
fullnameOverride: ""
