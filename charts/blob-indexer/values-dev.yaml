# Development values for blob-indexer
image:
  pullPolicy: Never

ingress:
  enabled: true
  hosts:
    - host: blob-indexer.localhost
      paths:
        - path: /
          pathType: Prefix

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

appConfig:
  server:
    dev_mode: true
  logging:
    level: "debug"
  indexer:
    version: "dev"
    batch_size: 100
    polling_interval: "15s"
    mempool_polling_interval: "30s"
  networks:
    - name: "sepolia"
      chain_id: 11155111
      rpc_url: "wss://sepolia-geth-ws.ahkc.win"
      start_block: "LATEST-300"
      enabled: true

healthCheck:
  initialDelaySeconds: 10
  periodSeconds: 5

postgresql:
  enabled: true
  auth:
    username: postgres
    password: postgres
    database: blobindexer
  primary:
    persistence:
      enabled: false
