# Development values for blob-indexer
image:
  registry: ""
  repository: blob-indexer-api
  pullPolicy: Never
  tag: "latest"

api:
  image:
    repository: blob-indexer-api

indexer:
  image:
    repository: blob-indexer-indexer

devService:
  enabled: true

ingress:
  enabled: true
  hosts:
    - host: blob-indexer.localhost
      paths:
        - path: /
          pathType: Prefix

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

appConfig:
  database:
    url: "postgres://postgres:postgres@blob-indexer-postgresql:5432/blobindexer?sslmode=disable"
  server:
    dev_port: 8081
    dev_mode: true
  logging:
    level: "debug"
  indexer:
    version: "dev"
    batch_size: 100
    polling_interval: "15s"
    mempool_polling_interval: "30s"
  attribution:
    blob_list_enabled: true
    blob_list_base_url: "https://raw.githubusercontent.com/ahkc4/blob-list/main/artifacts/by-chain"
    blob_list_refresh_interval: "1h"
    blob_list_request_timeout: "10s"
  networks:
    - name: "sepolia"
      chain_id: 11155111
      rpc_url: "wss://sepolia.example.com/ws"
      start_block: "LATEST-300"
      enabled: true

# Local dev images are built from the working tree, which may predate the
# dedicated /api/v1/healthz and /api/v1/readyz endpoints. Keep probes on the
# always-present /api/v1/status until those land.
healthCheck:
  path: /api/v1/status
  livenessPath: /api/v1/status
  readinessPath: /api/v1/status
  initialDelaySeconds: 10
  periodSeconds: 5
