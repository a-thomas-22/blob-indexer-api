basePath: /api/v1
definitions:
  api.BlobParamsResponse:
    properties:
      max:
        type: integer
      max_gas:
        type: integer
      target:
        type: integer
      target_gas:
        type: integer
      update_fraction:
        type: integer
    type: object
  api.BlobResponse:
    properties:
      base_fee_per_blob_gas:
        type: string
      blob_gas_used:
        type: integer
      blob_index:
        type: integer
      blob_size_bytes:
        type: integer
      block_number:
        type: integer
      confirmed:
        type: boolean
      fee_cap_headroom_percent:
        type: string
      fee_cap_headroom_wei:
        type: string
      from_address:
        type: string
      max_cost_wei:
        type: string
      max_fee_per_blob_gas:
        type: string
      network_id:
        type: integer
      network_name:
        type: string
      realized_cost_wei:
        type: string
      timestamp:
        type: string
      tip_per_blob_gas:
        type: string
      total_cost_eth:
        type: string
      tx_hash:
        type: string
      user_attribution:
        type: string
    type: object
  api.BlockPricingResponse:
    properties:
      available_blobs:
        type: integer
      blob_base_fee:
        type: string
      blob_count:
        type: integer
      blob_gas_limit:
        type: integer
      blob_gas_target:
        type: integer
      blob_gas_used:
        type: integer
      blob_params_max:
        type: integer
      blob_params_target:
        type: integer
      block_number:
        type: integer
      block_timestamp:
        type: string
      excess_blob_gas:
        type: integer
      is_above_target:
        type: boolean
      is_full:
        type: boolean
      max_blobs:
        type: integer
      target_blobs:
        type: integer
      update_fraction:
        type: integer
      utilization_percent:
        type: number
      utilization_ratio:
        type: string
    type: object
  api.DatabaseStats:
    properties:
      connection_count:
        type: integer
      idle_connections:
        type: integer
      in_use_connections:
        type: integer
      last_migration_time:
        type: string
      max_open_connections:
        type: integer
      table_stats:
        items:
          $ref: '#/definitions/api.TableStat'
        type: array
      total_size:
        type: string
      total_tables:
        type: integer
    type: object
  api.IndexerMetrics:
    properties:
      confirmed_blobs_count:
        type: integer
      last_indexed_block:
        type: integer
      last_indexed_time:
        type: string
      network_id:
        type: integer
      network_name:
        type: string
      pending_blobs_count:
        type: integer
      total_blobs_indexed:
        type: integer
    type: object
  api.LogEntry:
    properties:
      fields:
        additionalProperties:
          type: string
        type: object
      level:
        type: string
      message:
        type: string
      timestamp:
        type: string
    type: object
  api.PricingResponse:
    properties:
      blob_params:
        $ref: '#/definitions/api.BlobParamsResponse'
      current_base_fee:
        type: string
      current_excess_gas:
        type: integer
      current_utilization:
        type: string
      fork_stage:
        type: string
      network_id:
        type: integer
      network_name:
        type: string
      predicted_next_fee:
        type: string
      recent_blocks:
        items:
          $ref: '#/definitions/api.BlockPricingResponse'
        type: array
    type: object
  api.QueryStat:
    properties:
      calls:
        type: integer
      execution_time:
        type: number
      last_executed:
        type: string
      query:
        type: string
      rows_returned:
        type: integer
    type: object
  api.Response:
    properties:
      data: {}
      error:
        type: string
      success:
        type: boolean
    type: object
  api.RollingStatsResponse:
    properties:
      generated_at:
        type: string
      network_id:
        type: integer
      network_name:
        type: string
      windows:
        items:
          $ref: '#/definitions/api.RollingWindowStats'
        type: array
    type: object
  api.RollingWindowStats:
    properties:
      average_blob_base_fee:
        type: string
      average_utilization:
        type: string
      duration_seconds:
        type: integer
      end_time:
        type: string
      median_blob_base_fee:
        type: string
      p95_blob_base_fee:
        type: string
      start_time:
        type: string
      total_blob_gas_used:
        type: integer
      total_blobs:
        type: integer
      total_cost_eth:
        type: string
      unique_senders:
        type: integer
      window:
        type: string
    type: object
  api.StatsResponse:
    properties:
      average_base_fee:
        type: string
      average_tip:
        type: string
      average_total_cost:
        type: string
      last_indexed_block:
        type: integer
      last_indexed_time:
        type: string
      network_id:
        type: integer
      network_name:
        type: string
      total_blobs:
        type: integer
      total_confirmed_blobs:
        type: integer
      total_pending_blobs:
        type: integer
    type: object
  api.StatusResponse:
    properties:
      indexer_version:
        type: string
      last_indexed_block:
        type: integer
      last_indexed_time:
        type: string
      network_id:
        type: integer
      network_name:
        type: string
      uptime:
        type: string
    type: object
  api.SystemMetrics:
    properties:
      active_requests:
        type: integer
      architecture:
        type: string
      current_time:
        type: string
      go_version:
        type: string
      memory_usage:
        type: string
      num_cpu:
        type: integer
      num_goroutine:
        type: integer
      operating_system:
        type: string
      start_time:
        type: string
      total_requests:
        type: integer
      uptime:
        type: string
    type: object
  api.TableStat:
    properties:
      index_count:
        type: integer
      last_vacuumed:
        type: string
      row_count:
        type: integer
      size_bytes:
        type: integer
      table_name:
        type: string
    type: object
  api.UserResponse:
    properties:
      address:
        type: string
      blob_count:
        type: integer
      last_timestamp:
        type: string
      name:
        type: string
      network_id:
        type: integer
      network_name:
        type: string
      total_cost_eth:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: support@example.com
    name: API Support
    url: https://github.com/a-thomas-22/blob-indexer-api
  description: API for indexing and querying blob transactions on Ethereum across
    multiple networks
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: Blob Indexer API
  version: "1.0"
paths:
  /blob/{txHash}:
    get:
      consumes:
      - application/json
      description: Retrieve a specific blob transaction by its hash
      parameters:
      - description: 'Network name or chain ID (default: first enabled network)'
        in: query
        name: network
        type: string
      - description: Transaction hash
        in: path
        name: txHash
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  $ref: '#/definitions/api.BlobResponse'
              type: object
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/api.Response'
        "404":
          description: Blob not found
          schema:
            $ref: '#/definitions/api.Response'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/api.Response'
      summary: Get blob by transaction hash
      tags:
      - blobs
  /blob/latest:
    get:
      consumes:
      - application/json
      description: Retrieve the latest confirmed blob transactions from the blockchain
      parameters:
      - description: 'Network name or chain ID (default: first enabled network)'
        in: query
        name: network
        type: string
      - description: 'Number of blobs to return (default: 10, max: 100)'
        in: query
        name: limit
        type: integer
      - description: 'Number of blobs to skip for pagination (default: 0, max: 10000)'
        in: query
        name: offset
        type: integer
      - description: Filter by sender address
        in: query
        name: from
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/api.BlobResponse'
                  type: array
              type: object
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/api.Response'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/api.Response'
      summary: Get latest confirmed blobs
      tags:
      - blobs
  /blob/mempool:
    get:
      consumes:
      - application/json
      description: Retrieve pending blob transactions from the mempool
      parameters:
      - description: 'Network name or chain ID (default: first enabled network)'
        in: query
        name: network
        type: string
      - description: 'Number of blobs to return (default: 10, max: 100)'
        in: query
        name: limit
        type: integer
      - description: 'Number of blobs to skip for pagination (default: 0, max: 10000)'
        in: query
        name: offset
        type: integer
      - description: Filter by sender address
        in: query
        name: from
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/api.BlobResponse'
                  type: array
              type: object
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/api.Response'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/api.Response'
      summary: Get pending blobs from mempool
      tags:
      - blobs
  /blob/pricing:
    get:
      consumes:
      - application/json
      description: Retrieve current and historical blob pricing with utilization metrics
        and fork parameters
      parameters:
      - description: 'Network name or chain ID (default: first enabled network)'
        in: query
        name: network
        type: string
      - description: 'Number of recent blocks to include (default: 20, max: 100)'
        in: query
        name: blocks
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  $ref: '#/definitions/api.PricingResponse'
              type: object
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/api.Response'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/api.Response'
      summary: Get blob pricing data
      tags:
      - blobs
  /dev/dashboard:
    get:
      consumes:
      - application/json
      description: Access the development dashboard
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  type: string
              type: object
      summary: Development dashboard
      tags:
      - dev
  /dev/database:
    get:
      consumes:
      - application/json
      description: Retrieve statistics about the database
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  $ref: '#/definitions/api.DatabaseStats'
              type: object
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/api.Response'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/api.Response'
      summary: Get database statistics
      tags:
      - dev
  /dev/indexers:
    get:
      consumes:
      - application/json
      description: Retrieve detailed metrics for all indexers
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/api.IndexerMetrics'
                  type: array
              type: object
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/api.Response'
      summary: Get indexer metrics
      tags:
      - dev
  /dev/logs:
    get:
      consumes:
      - application/json
      description: Retrieve recent application logs
      parameters:
      - description: 'Number of logs to return (default: 100)'
        in: query
        name: limit
        type: integer
      - description: Filter by log level (info, warn, error, debug)
        in: query
        name: level
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/api.LogEntry'
                  type: array
              type: object
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/api.Response'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/api.Response'
      summary: Get recent logs
      tags:
      - dev
  /dev/metrics:
    get:
      consumes:
      - application/json
      description: Retrieve system-wide metrics including memory usage, goroutine
        count, etc.
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  $ref: '#/definitions/api.SystemMetrics'
              type: object
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/api.Response'
      summary: Get system metrics
      tags:
      - dev
  /dev/queries:
    get:
      consumes:
      - application/json
      description: Retrieve statistics about database queries
      parameters:
      - description: 'Number of queries to return (default: 20)'
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/api.QueryStat'
                  type: array
              type: object
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/api.Response'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/api.Response'
      summary: Get database query statistics
      tags:
      - dev
  /stats:
    get:
      consumes:
      - application/json
      description: Retrieve statistics about blob transactions
      parameters:
      - description: 'Network name or chain ID (default: first enabled network)'
        in: query
        name: network
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  $ref: '#/definitions/api.StatsResponse'
              type: object
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/api.Response'
      summary: Get blob statistics
      tags:
      - stats
  /stats/windows:
    get:
      consumes:
      - application/json
      description: Retrieve rolling time-window statistics for blob market dashboards
      parameters:
      - description: 'Network name or chain ID (default: first enabled network)'
        in: query
        name: network
        type: string
      - description: 'Comma-separated rolling windows using m/h/d units (default:
          5m,1h,24h,7d; max 8 windows, max 30d each)'
        in: query
        name: windows
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  $ref: '#/definitions/api.RollingStatsResponse'
              type: object
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/api.Response'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/api.Response'
      summary: Get rolling blob market statistics
      tags:
      - stats
  /status:
    get:
      consumes:
      - application/json
      description: Retrieve the current status of the indexer
      parameters:
      - description: 'Network name or chain ID (default: first enabled network)'
        in: query
        name: network
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  $ref: '#/definitions/api.StatusResponse'
              type: object
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/api.Response'
      summary: Get indexer status
      tags:
      - status
  /users:
    get:
      consumes:
      - application/json
      description: Retrieve the top users of blob transactions by count
      parameters:
      - description: 'Network name or chain ID (default: first enabled network)'
        in: query
        name: network
        type: string
      - description: 'Number of users to return (default: 10, max: 100)'
        in: query
        name: limit
        type: integer
      - description: 'Number of users to skip for pagination (default: 0, max: 10000)'
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/api.UserResponse'
                  type: array
              type: object
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/api.Response'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/api.Response'
      summary: Get top blob users
      tags:
      - users
  /users/{address}:
    get:
      consumes:
      - application/json
      description: Retrieve aggregated blob statistics for a specific sender address
      parameters:
      - description: 'Network name or chain ID (default: first enabled network)'
        in: query
        name: network
        type: string
      - description: Ethereum address
        in: path
        name: address
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  $ref: '#/definitions/api.UserResponse'
              type: object
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/api.Response'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/api.Response'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/api.Response'
      summary: Get user by address
      tags:
      - users
schemes:
- http
- https
swagger: "2.0"
tags:
- description: Network-related endpoints
  name: networks
- description: Blob transaction endpoints
  name: blobs
- description: User attribution endpoints
  name: users
- description: Statistics endpoints
  name: stats
- description: Indexer status endpoints
  name: status
- description: Development endpoints (only available in dev mode)
  name: dev
