asyncapi: '2.6.0'
id: urn:github.com:a-thomas-22:blob-indexer-api:websocket
info:
  title: Blob Indexer WebSocket API
  version: '1.0.0'
  description: |
    Realtime WebSocket contract for Blob Indexer clients.

    The WebSocket endpoint sends JSON text frames directly. Messages are not
    wrapped in the REST API `{ success, data, error }` envelope. Each server
    message has a `type` discriminator and, except for heartbeat pings, a
    `data` payload whose schema depends on `type`.
  contact:
    name: API Support
    url: https://github.com/a-thomas-22/blob-indexer-api
    email: support@example.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
tags:
  - name: realtime
    description: WebSocket events pushed by the Blob Indexer API.
  - name: blobs
    description: Blob transaction events.
  - name: stats
    description: Aggregate blob statistics.
defaultContentType: application/json
servers:
  public:
    url: '{host}'
    protocol: wss
    description: Public API host. Use `ws` instead of `wss` for local HTTP development.
    variables:
      host:
        default: localhost:8080
        description: API host and optional port, without scheme.
channels:
  /api/v1/ws:
    description: |
      Upgrade this HTTP GET route to a WebSocket connection. Events are scoped
      to the `network` query parameter selected at connection time.
    bindings:
      ws:
        bindingVersion: '0.1.0'
        query:
          type: object
          properties:
            network:
              oneOf:
                - type: string
                  description: Network name, for example `mainnet` or `sepolia`.
                - type: integer
                  description: Chain ID, for example `1` or `11155111`.
    publish:
      operationId: receiveRealtimeBlobEvents
      summary: Server publishes realtime blob events to connected clients.
      description: |
        By default the server sends all event types for the selected network.
        The server also sends an application-level `{ "type": "ping" }`
        heartbeat every 30 seconds, plus WebSocket protocol ping frames.
      message:
        oneOf:
          - $ref: '#/components/messages/NewBlockEvent'
          - $ref: '#/components/messages/MempoolUpdateEvent'
          - $ref: '#/components/messages/StatsUpdateEvent'
          - $ref: '#/components/messages/UsersUpdateEvent'
          - $ref: '#/components/messages/UsersGroupedUpdateEvent'
          - $ref: '#/components/messages/PingEvent'
    subscribe:
      operationId: sendSubscriptionFilter
      summary: Client optionally sends a subscription filter.
      description: |
        Send this after connection open to restrict event delivery. Sending no
        filter means all subscribable events. Empty `subscribe` arrays and
        unparseable messages are ignored. The server does not send an ack.
      message:
        $ref: '#/components/messages/SubscribeMessage'
components:
  messages:
    NewBlockEvent:
      messageId: newBlockEvent
      name: new_block
      title: New Block Event
      summary: A newly indexed block containing blobs.
      payload:
        $ref: '#/components/schemas/NewBlockEvent'
    MempoolUpdateEvent:
      messageId: mempoolUpdateEvent
      name: mempool_update
      title: Mempool Update Event
      summary: A pending blob transaction entered or left the mempool snapshot.
      payload:
        $ref: '#/components/schemas/MempoolUpdateEvent'
    StatsUpdateEvent:
      messageId: statsUpdateEvent
      name: stats_update
      title: Stats Update Event
      summary: Aggregate blob statistics changed.
      payload:
        $ref: '#/components/schemas/StatsUpdateEvent'
    UsersUpdateEvent:
      messageId: usersUpdateEvent
      name: users_update
      title: Users Update Event
      summary: Top blob user rankings changed.
      payload:
        $ref: '#/components/schemas/UsersUpdateEvent'
    UsersGroupedUpdateEvent:
      messageId: usersGroupedUpdateEvent
      name: users_grouped_update
      title: Users Grouped Update Event
      summary: Entity-grouped top blob user rankings changed.
      payload:
        $ref: '#/components/schemas/UsersGroupedUpdateEvent'
    PingEvent:
      messageId: pingEvent
      name: ping
      title: Ping Event
      summary: Application-level heartbeat.
      payload:
        $ref: '#/components/schemas/PingEvent'
    SubscribeMessage:
      messageId: subscribeMessage
      name: subscribe
      title: Subscription Filter
      summary: Client-to-server event filter.
      payload:
        $ref: '#/components/schemas/SubscribeMessage'
  schemas:
    SubscribableEventType:
      type: string
      enum:
        - new_block
        - mempool_update
        - stats_update
        - users_update
        - users_grouped_update
    DecimalString:
      type: string
      description: Decimal-encoded numeric value serialized as a string. Aggregate values may include fractional decimal precision.
      example: '0.001'
    WeiString:
      type: string
      description: Decimal-encoded wei value serialized as a string. Per-transaction values are integers; aggregate averages may include fractional decimal precision.
      example: '1000000000'
    ISODateTime:
      type: string
      format: date-time
      example: '2026-03-09T14:00:00Z'
    NewBlockEvent:
      type: object
      required:
        - type
        - data
      properties:
        type:
          type: string
          enum:
            - new_block
        data:
          $ref: '#/components/schemas/NewBlockData'
    NewBlockData:
      type: object
      required:
        - block_number
        - blob_count
        - timestamp
        - blobs
      properties:
        block_number:
          type: integer
          format: int64
        blob_count:
          type: integer
        timestamp:
          $ref: '#/components/schemas/ISODateTime'
        blobs:
          type: array
          items:
            $ref: '#/components/schemas/BlobResponse'
        pricing:
          allOf:
            - $ref: '#/components/schemas/BlockPricingResponse'
          description: Recent-block pricing and capacity fields matching `/api/v1/blob/pricing` recent block entries when block metrics are available.
        builder:
          allOf:
            - $ref: '#/components/schemas/BlockBuilderResponse'
          description: >-
            Who built the block, from the header's fee recipient and extra
            data. Omitted for blocks with no builder row — blocks indexed
            before builder attribution existed, until the indexer's backfill
            reaches them. The row is written in the same transaction as the
            block's metrics, so it is never half-present. `GET
            /api/v1/block/{number}` carries the same object, plus a REST-only
            `candidates` list that this event does not.
    BlockBuilderResponse:
      type: object
      description: >-
        Identity of a block's builder plus, when the indexer saw the block
        arrive live, a summary of its own pending blob pool at that moment.
        `key`/`name` are what the indexer's builder registry resolved from the
        raw header fields; `fee_recipient` and `extra_data` stay
        authoritative, so a later registry release can relabel a block without
        the raw evidence changing.
      required:
        - key
        - name
        - known
        - fee_recipient
        - extra_data
        - tx_count
        - candidate_snapshot
      properties:
        key:
          type: string
          description: Grouping key shared with `/api/v1/builders` and `/api/v1/charts/builder-share`.
          example: beaverbuild
        name:
          type: string
          example: beaverbuild
        known:
          type: boolean
          description: True only when the registry recognized the builder; false means the key was derived from the extra data (`extra:` prefix) or the fee recipient (`addr:` prefix).
        fee_recipient:
          type: string
          description: The header's coinbase. Under MEV-Boost this is usually the builder's own address; for a locally built block it is the proposer's fee recipient, so it is ambiguous on its own.
        extra_data:
          type: string
          description: The header's extraData as 0x-hex.
          example: '0x6265617665726275696c642e6f7267'
        extra_data_text:
          type: string
          description: extra_data decoded as text, present only when every byte is printable ASCII.
          example: beaverbuild.org
        tx_count:
          type: integer
          description: Transactions in the block, blob-carrying or not.
        proposer_payment_wei:
          allOf:
            - $ref: '#/components/schemas/WeiString'
          description: >-
            Value of the block's last transaction when the fee recipient sent
            it — the conventional MEV-Boost proposer payment. Omitted
            otherwise, which is a heuristic; some builders pay the proposer by
            setting coinbase to the proposer's fee recipient instead.
        proposer_payment_eth:
          $ref: '#/components/schemas/DecimalString'
        proposer_payment_to:
          type: string
        candidate_snapshot:
          type: boolean
          description: Whether the indexer classified its pending blob pool against this block. False for blocks indexed from history — the pool is meaningless for a block that arrived long ago — and the four aggregates below are then omitted.
        pending_candidate_txs:
          type: integer
        eligible_skipped_txs:
          type: integer
          description: >-
            Pending blob transactions our node had seen that nothing
            disqualified and the block did not include. Our node's mempool is
            not the builder's, so read this as "visible to our node and not
            included", not as proof the builder passed on them.
        eligible_skipped_blobs:
          type: integer
        eligible_skipped_max_tip:
          $ref: '#/components/schemas/WeiString'
        eligible_skipped_max_tip_gwei:
          $ref: '#/components/schemas/DecimalString'
    BlockPricingResponse:
      type: object
      properties:
        block_number:
          type: integer
          format: int64
        block_timestamp:
          $ref: '#/components/schemas/ISODateTime'
        blob_count:
          type: integer
        blob_gas_used:
          type: integer
          format: int64
        blob_gas_target:
          type: integer
          format: int64
        blob_gas_limit:
          type: integer
          format: int64
        excess_blob_gas:
          type: integer
          format: int64
        blob_base_fee:
          $ref: '#/components/schemas/WeiString'
        blob_base_fee_gwei:
          $ref: '#/components/schemas/DecimalString'
        utilization_ratio:
          $ref: '#/components/schemas/DecimalString'
        blob_params_target:
          type: integer
          deprecated: true
          description: Deprecated compatibility field; use `target_blobs`.
        blob_params_max:
          type: integer
          deprecated: true
          description: Deprecated compatibility field; use `max_blobs`.
        target_blobs:
          type: integer
        max_blobs:
          type: integer
        available_blobs:
          type: integer
        utilization_percent:
          type: number
          format: double
        is_full:
          type: boolean
        is_above_target:
          type: boolean
        update_fraction:
          type: integer
          format: int64
    MempoolUpdateEvent:
      type: object
      required:
        - type
        - data
      properties:
        type:
          type: string
          enum:
            - mempool_update
        data:
          $ref: '#/components/schemas/MempoolUpdateData'
    MempoolUpdateData:
      type: object
      required:
        - action
        - blob
      properties:
        action:
          type: string
          enum:
            - add
            - remove
          description: '`add` includes the observed pending blob row. `remove` is a tx-level signal and only includes `tx_hash`, `network_id`, and `network_name`.'
        blob:
          $ref: '#/components/schemas/BlobResponse'
    StatsUpdateEvent:
      type: object
      required:
        - type
        - data
      properties:
        type:
          type: string
          enum:
            - stats_update
        data:
          $ref: '#/components/schemas/StatsResponse'
    UsersUpdateEvent:
      type: object
      required:
        - type
        - range
        - data
      properties:
        type:
          type: string
          enum:
            - users_update
        range:
          type: string
          description: |
            Aggregation window the payload covers, matching the REST `range`
            values on GET /users. Currently always `all`; clients viewing a
            different range should drop events whose range does not match it.
          enum:
            - all
        data:
          type: array
          description: Top 10 users for all time, sorted by blob count — one row per sender address.
          items:
            $ref: '#/components/schemas/UserResponse'
    UsersGroupedUpdateEvent:
      type: object
      description: |
        Entity-grouped companion to `users_update`, broadcast on the same
        throttle and mirroring GET /users?group=entity: attributed addresses
        merge into one row per attribution entity while unattributed addresses
        stay individual rows. Sent as a distinct event type so clients unaware
        of grouping never mistake grouped rows for per-address rows.
      required:
        - type
        - range
        - group
        - data
      properties:
        type:
          type: string
          enum:
            - users_grouped_update
        range:
          type: string
          description: Aggregation window the payload covers, matching the REST `range` values on GET /users. Currently always `all`.
          enum:
            - all
        group:
          type: string
          description: Row grouping of the payload, matching the REST `group` values on GET /users. Always `entity` on this event type.
          enum:
            - entity
        data:
          type: array
          description: |
            Top 10 grouped rows for all time, sorted by blob count. Rows carry
            `key` and `addresses` (busiest first), and `address` is the
            group's busiest member.
          items:
            $ref: '#/components/schemas/UserResponse'
    PingEvent:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - ping
      description: Heartbeat with no `data` field.
    SubscribeMessage:
      type: object
      required:
        - subscribe
      properties:
        subscribe:
          type: array
          items:
            $ref: '#/components/schemas/SubscribableEventType'
      example:
        subscribe:
          - new_block
          - stats_update
    BlobResponse:
      type: object
      description: |
        Blob row shape shared with REST blob endpoints. WebSocket `new_block`
        and `mempool_update` add events include the available blob fields.
        `mempool_update` remove events are minimal and identify the transaction
        to remove by `tx_hash`.
      properties:
        network_id:
          type: integer
        network_name:
          type: string
        block_number:
          type: integer
          format: int64
        blob_index:
          type: integer
        tx_hash:
          type: string
          example: '0xabc123'
        transaction_url:
          type: string
          format: uri
        from_address:
          type: string
          example: '0x0000000000000000000000000000000000000000'
        from_address_url:
          type: string
          format: uri
        block_url:
          type: string
          format: uri
        user_attribution:
          type: string
        blob_size_bytes:
          type: integer
          format: int64
        base_fee_per_blob_gas:
          $ref: '#/components/schemas/WeiString'
        base_fee_per_blob_gas_gwei:
          $ref: '#/components/schemas/DecimalString'
        tip_per_blob_gas:
          $ref: '#/components/schemas/WeiString'
        tip_per_blob_gas_gwei:
          $ref: '#/components/schemas/DecimalString'
        total_cost_wei:
          allOf:
            - $ref: '#/components/schemas/WeiString'
          description: Realized blob base-fee cost in wei.
        total_cost_eth:
          allOf:
            - $ref: '#/components/schemas/WeiString'
          deprecated: true
          description: Deprecated alias for `total_cost_wei`; this legacy field contains wei, not ETH.
        timestamp:
          $ref: '#/components/schemas/ISODateTime'
        confirmed:
          type: boolean
        max_fee_per_blob_gas:
          $ref: '#/components/schemas/WeiString'
        max_fee_per_blob_gas_gwei:
          $ref: '#/components/schemas/DecimalString'
        blob_gas_used:
          type: integer
          format: int64
        max_priority_fee_per_gas:
          allOf:
            - $ref: '#/components/schemas/WeiString'
          description: The transaction's EIP-1559 priority fee cap, the bid builders order competing blob transactions by. Omitted for rows indexed before it was stored.
        max_priority_fee_per_gas_gwei:
          $ref: '#/components/schemas/DecimalString'
        max_fee_per_gas:
          allOf:
            - $ref: '#/components/schemas/WeiString'
          description: The transaction's EIP-1559 total fee cap. Omitted for rows indexed before it was stored.
        max_fee_per_gas_gwei:
          $ref: '#/components/schemas/DecimalString'
        priority_fee_per_gas:
          allOf:
            - $ref: '#/components/schemas/WeiString'
          description: Priority fee actually paid per execution gas, min(max_priority_fee_per_gas, max_fee_per_gas minus the block base fee). Omitted for pending blobs and rows indexed before it was stored.
        priority_fee_per_gas_gwei:
          $ref: '#/components/schemas/DecimalString'
        realized_cost_wei:
          $ref: '#/components/schemas/WeiString'
        max_cost_wei:
          $ref: '#/components/schemas/WeiString'
        fee_cap_headroom_wei:
          $ref: '#/components/schemas/WeiString'
        fee_cap_headroom_percent:
          $ref: '#/components/schemas/DecimalString'
        versioned_hash:
          type: string
          description: This blob's own EIP-4844 versioned hash (0x01-prefixed). blob_index cannot locate the blob within versioned_hashes (for confirmed rows it is the block-wide ordinal), so this field identifies the row's blob. Omitted for rows indexed before versioned hashes were stored.
          example: '0x01a1f8730e4064f7dd90279b721b25e28c07fc3e16d5fd4a26e6d3d5e9e0dbeb'
        versioned_hashes:
          type: array
          items:
            type: string
          description: The carrying transaction's full ordered list of EIP-4844 versioned blob hashes (0x01-prefixed). Omitted for rows indexed before versioned hashes were stored.
          example: ['0x01a1f8730e4064f7dd90279b721b25e28c07fc3e16d5fd4a26e6d3d5e9e0dbeb']
        slot:
          type: integer
          format: int64
          description: The beacon slot of the including block — the key beacon-side blob reads (e.g. BlobArchive's /eth/v1/beacon/blobs/{slot}) are indexed by. Omitted for pending (mempool) blobs, which have no slot until inclusion, and for networks whose beacon genesis time is not configured.
          example: 11813607
        tx_index:
          type: integer
          description: The carrying transaction's position in its block. Omitted for pending (mempool) blobs, which have no position until inclusion, and for confirmed rows indexed before it was stored that no backfill or reindex has revisited.
          example: 12
        first_seen_at:
          allOf:
            - $ref: '#/components/schemas/ISODateTime'
          description: When the indexer first saw the transaction pending. For pending blobs it is the row's own first-seen time; for confirmed ones it is that time carried over when the block promoted the row. Omitted when the transaction was never observed pending (indexed from history, or it arrived with its block) and for rows indexed before it was stored.
        time_to_inclusion_ms:
          type: integer
          format: int64
          description: >-
            How long the transaction waited: the including block's timestamp
            minus first_seen_at. Omitted for pending blobs and whenever
            first_seen_at is. CAN BE NEGATIVE — a block's timestamp is its
            slot start, so a transaction our node first saw after that instant
            but which still made the block yields a negative wait. That is
            real information (the builder had it before we did), so it is
            reported rather than clamped.
          example: 4200
    StatsResponse:
      type: object
      description: Network identity comes from the connection query. `network_id` and `network_name` may be omitted in WebSocket stats updates.
      required:
        - total_blobs
        - total_confirmed_blobs
        - total_pending_blobs
        - average_base_fee_per_blob_gas_wei
        - average_tip_per_blob_gas_wei
        - average_total_cost_wei
        - average_base_fee
        - average_tip
        - average_total_cost
        - last_indexed_block
        - last_indexed_time
      properties:
        network_id:
          type: integer
        network_name:
          type: string
        total_blobs:
          type: integer
        total_confirmed_blobs:
          type: integer
        total_pending_blobs:
          type: integer
        average_base_fee_per_blob_gas_wei:
          allOf:
            - $ref: '#/components/schemas/WeiString'
          description: Average base fee per blob gas in wei. May include fractional decimal precision because it is an aggregate average.
        average_tip_per_blob_gas_wei:
          allOf:
            - $ref: '#/components/schemas/WeiString'
          description: Average priority tip per blob gas in wei. May include fractional decimal precision because it is an aggregate average.
        average_total_cost_wei:
          allOf:
            - $ref: '#/components/schemas/WeiString'
          description: Average realized blob base-fee cost in wei. May include fractional decimal precision because it is an aggregate average.
        average_base_fee:
          allOf:
            - $ref: '#/components/schemas/WeiString'
          deprecated: true
          description: Deprecated alias for `average_base_fee_per_blob_gas_wei`.
        average_tip:
          allOf:
            - $ref: '#/components/schemas/WeiString'
          deprecated: true
          description: Deprecated alias for `average_tip_per_blob_gas_wei`.
        average_total_cost:
          allOf:
            - $ref: '#/components/schemas/WeiString'
          deprecated: true
          description: Deprecated alias for `average_total_cost_wei`.
        last_indexed_block:
          type: integer
          format: int64
        last_indexed_time:
          $ref: '#/components/schemas/ISODateTime'
    UserResponse:
      type: object
      required:
        - network_id
        - address
        - blob_count
        - total_cost_wei
        - total_cost_eth
        - last_timestamp
      properties:
        network_id:
          type: integer
        network_name:
          type: string
        address:
          type: string
          description: Sender address; in entity-grouped payloads, the group's primary (busiest) member address.
        name:
          type: string
        category:
          type: string
        key:
          type: string
          description: Present only in entity-grouped payloads — the entity slug for attributed rows (matching /charts/attribution-usage series keys) or the sender address for unattributed rows.
          example: scroll
        addresses:
          type: array
          items:
            type: string
          description: Present only in entity-grouped payloads — the group's member addresses, busiest first; `address` is the first element.
        blob_count:
          type: integer
        total_cost_wei:
          allOf:
            - $ref: '#/components/schemas/WeiString'
          description: Total realized blob base-fee cost in wei.
        total_cost_eth:
          allOf:
            - $ref: '#/components/schemas/WeiString'
          deprecated: true
          description: Deprecated alias for `total_cost_wei`; this legacy field contains wei, not ETH.
        last_timestamp:
          $ref: '#/components/schemas/ISODateTime'
        blob_share_percent:
          type: number
          format: double
        spend_share_percent:
          type: number
          format: double
