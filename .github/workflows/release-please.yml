name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      # App release outputs
      app_release_created: ${{ steps.release.outputs['blob-indexer-api--release_created'] }}
      app_tag_name: ${{ steps.release.outputs['blob-indexer-api--tag_name'] }}
      app_version: ${{ steps.release.outputs['blob-indexer-api--version'] }}
      # Chart release outputs
      chart_release_created: ${{ steps.release.outputs['charts/blob-indexer--release_created'] || steps.release.outputs['blob-indexer-chart--release_created'] }}
      chart_tag_name: ${{ steps.release.outputs['charts/blob-indexer--tag_name'] || steps.release.outputs['blob-indexer-chart--tag_name'] }}
      chart_version: ${{ steps.release.outputs['charts/blob-indexer--version'] || steps.release.outputs['blob-indexer-chart--version'] }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-helm-chart:
    name: Publish Helm Chart
    needs: release-please
    if: needs.release-please.outputs.chart_release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: azure/setup-helm@v5

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Package chart
        run: helm package charts/blob-indexer --version "${{ needs.release-please.outputs.chart_version }}"

      - name: Push chart to GHCR
        run: helm push blob-indexer-${{ needs.release-please.outputs.chart_version }}.tgz oci://ghcr.io/${{ github.repository_owner }}/charts
