name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      # App release outputs. The app package lives at the root path ".", and
      # release-please emits root-path outputs without a path prefix — the
      # component-prefixed keys are kept only as a fallback.
      app_release_created: ${{ steps.release.outputs.release_created || steps.release.outputs['blob-indexer-api--release_created'] }}
      app_tag_name: ${{ steps.release.outputs.tag_name || steps.release.outputs['blob-indexer-api--tag_name'] }}
      app_version: ${{ steps.release.outputs.version || steps.release.outputs['blob-indexer-api--version'] }}
      # Chart release outputs
      chart_release_created: ${{ steps.release.outputs['charts/blob-indexer--release_created'] || steps.release.outputs['blob-indexer-chart--release_created'] }}
      chart_tag_name: ${{ steps.release.outputs['charts/blob-indexer--tag_name'] || steps.release.outputs['blob-indexer-chart--tag_name'] }}
      chart_version: ${{ steps.release.outputs['charts/blob-indexer--version'] || steps.release.outputs['blob-indexer-chart--version'] }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  sync-chart-app-version:
    # The app release commit is a hidden `chore` type, so it never triggers a
    # chart release on its own. Push the appVersion bump as a releasable
    # fix(helm) commit instead, so release-please opens a chart release PR
    # that ships the new app version.
    name: Sync Chart App Version
    needs: release-please
    if: needs.release-please.outputs.app_release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          # Use the PAT so the push triggers the release-please workflow run
          # that opens the chart release PR (GITHUB_TOKEN pushes do not
          # trigger workflows).
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - name: Commit chart appVersion bump
        run: |
          set -euo pipefail
          version="${{ needs.release-please.outputs.app_version }}"
          sed -i "s/^appVersion: .*/appVersion: ${version}/" charts/blob-indexer/Chart.yaml
          if git diff --quiet; then
            echo "Chart appVersion is already ${version}; nothing to do"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add charts/blob-indexer/Chart.yaml
          git commit -m "fix(helm): update chart app version to ${version}"
          git push origin HEAD:main

  publish-helm-chart:
    name: Publish Helm Chart
    needs: release-please
    if: needs.release-please.outputs.chart_release_created == 'true'
    runs-on: ubuntu-latest
    env:
      REGISTRY: registry.ahkc.win
      REGISTRY_PROJECT: public
    steps:
      - uses: actions/checkout@v6

      - uses: azure/setup-helm@v5

      - name: Login to Harbor
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: echo "${REGISTRY_PASSWORD}" | helm registry login "${REGISTRY}" -u "${REGISTRY_USERNAME}" --password-stdin

      - name: Package chart
        run: |
          set -euo pipefail
          app_version="$(jq -r '."."' .release-please-manifest.json)"
          if [ -z "$app_version" ] || [ "$app_version" = "null" ]; then
            echo "::error::.release-please-manifest.json is missing the root app version"
            exit 1
          fi
          helm package charts/blob-indexer \
            --version "${{ needs.release-please.outputs.chart_version }}" \
            --app-version "${app_version}"

      - name: Push chart to Harbor
        run: helm push blob-indexer-${{ needs.release-please.outputs.chart_version }}.tgz oci://${REGISTRY}/${REGISTRY_PROJECT}/charts
