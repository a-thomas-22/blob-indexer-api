name: Chart Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "charts/**"
      - "Dockerfile.api"
      - "Dockerfile.indexer"
      - ".release-please-manifest.json"
      - "release-please-config.json"
      - ".github/workflows/chart-test.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect:
    name: Detect Chart Changes
    runs-on: ubuntu-latest
    outputs:
      chart_changed: ${{ steps.changes.outputs.chart_changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect chart-relevant changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "pull_request" ]; then
            DIFF_BASE=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          elif git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            DIFF_BASE="$BASE_SHA"
          else
            echo "chart_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --name-only "$DIFF_BASE" "$HEAD_SHA" | grep -Eq '^(charts/|Dockerfile\.api$|Dockerfile\.indexer$|\.release-please-manifest\.json$|release-please-config\.json$|\.github/workflows/chart-test\.yml$)'; then
            echo "chart_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "chart_changed=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: Chart Lint
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.chart_changed == 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: azure/setup-helm@v5
        with:
          version: v3.14.0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: ./.github/actions/setup-chart-testing

      - name: Verify chart appVersion matches app release
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          app_version="$(jq -r '."."' .release-please-manifest.json)"
          chart_app_version="$(helm show chart charts/blob-indexer | awk -F': *' '$1 == "appVersion" {gsub(/^"|"$/, "", $2); print $2}')"

          if [ -z "$app_version" ] || [ "$app_version" = "null" ]; then
            echo "::error::.release-please-manifest.json is missing the root app version"
            exit 1
          fi

          if [ "$chart_app_version" = "$app_version" ]; then
            echo "Chart appVersion matches app version ${app_version}"
            exit 0
          fi

          # The app release PR (and its merge commit on main) bumps the
          # manifest before the sync-chart-app-version job pushes the
          # appVersion bump, so the chart is allowed to lag by exactly the
          # in-flight release.
          if [ "$EVENT_NAME" = "pull_request" ]; then
            DIFF_BASE=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          elif git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            DIFF_BASE="$BASE_SHA"
          else
            DIFF_BASE=""
          fi

          if [ -n "$DIFF_BASE" ]; then
            prev_app_version="$(git show "${DIFF_BASE}:.release-please-manifest.json" | jq -r '."."')"
            if [ "$chart_app_version" = "$prev_app_version" ]; then
              echo "Chart appVersion (${chart_app_version}) lags the in-flight app release (${app_version}); sync-chart-app-version updates it after the release merges"
              exit 0
            fi
          fi

          echo "::error::charts/blob-indexer/Chart.yaml appVersion (${chart_app_version}) must match the app release version (${app_version})"
          exit 1

      - name: Run chart template tests
        run: make chart-template-test

      - name: Run ct lint
        run: ct lint --config charts/ct.yaml

  install:
    name: Chart Install & Test
    runs-on: ubuntu-latest
    needs:
      - detect
      - lint
    if: needs.detect.outputs.chart_changed == 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: azure/setup-helm@v5
        with:
          version: v3.14.0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: ./.github/actions/setup-chart-testing

      - name: Add Bitnami repo
        run: helm repo add bitnami https://charts.bitnami.com/bitnami

      - name: Create kind cluster
        uses: helm/kind-action@v1.14.0
        with:
          cluster_name: chart-testing

      - name: Build Docker images
        run: |
          docker build -f Dockerfile.api -t blob-indexer-api:test .
          docker build -f Dockerfile.indexer -t blob-indexer-indexer:test .

      - name: Load images into kind
        run: |
          kind load docker-image blob-indexer-api:test --name chart-testing
          kind load docker-image blob-indexer-indexer:test --name chart-testing

      - name: Install test PostgreSQL
        run: |
          helm upgrade --install blob-indexer-postgresql bitnami/postgresql \
            --set auth.username=testuser \
            --set auth.password=testpass \
            --set auth.database=blobindexer \
            --set primary.persistence.enabled=false \
            --wait \
            --timeout 300s

      - name: Install chart and run tests
        env:
          SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
        run: |
          ct install \
            --config charts/ct.yaml \
            --helm-extra-set-args "--values charts/blob-indexer/values-test.yaml --set appConfig.networks[0].rpc_url=$SEPOLIA_RPC_URL" \
            --helm-extra-args "--timeout 300s"

  gate:
    name: Chart Gate
    runs-on: ubuntu-latest
    needs:
      - detect
      - lint
      - install
    if: always()
    steps:
      - name: Verify chart checks
        env:
          CHART_CHANGED: ${{ needs.detect.outputs.chart_changed }}
          DETECT_RESULT: ${{ needs.detect.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          INSTALL_RESULT: ${{ needs.install.result }}
        run: |
          set -euo pipefail

          if [ "$DETECT_RESULT" != "success" ]; then
            echo "Chart change detection failed or did not complete."
            echo "Detect Chart Changes: $DETECT_RESULT"
            exit 1
          fi

          if [ "$CHART_CHANGED" = "false" ]; then
            echo "No chart-relevant files changed; chart checks not required."
            exit 0
          fi

          if [ "$CHART_CHANGED" != "true" ]; then
            echo "Chart change detection produced an invalid result: $CHART_CHANGED"
            exit 1
          fi

          if [ "$LINT_RESULT" != "success" ] || [ "$INSTALL_RESULT" != "success" ]; then
            echo "Chart checks failed or did not complete."
            echo "Chart Lint: $LINT_RESULT"
            echo "Chart Install & Test: $INSTALL_RESULT"
            exit 1
          fi

          echo "Chart checks passed."
