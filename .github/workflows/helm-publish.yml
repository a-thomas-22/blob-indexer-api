name: Helm Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Helm chart version to publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  helm:
    # Only run for chart releases, not app releases
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'blob-indexer-chart-v')
    runs-on: ubuntu-latest
    env:
      REGISTRY: registry.ahkc.win
    steps:
      - uses: actions/checkout@v6

      - name: Extract version from tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#blob-indexer-chart-v}" >> "$GITHUB_OUTPUT"
          fi

      - uses: azure/setup-helm@v5

      - name: Login to Harbor
        run: echo "${{ secrets.REGISTRY_PASSWORD }}" | helm registry login "${REGISTRY}" -u "${{ secrets.REGISTRY_USERNAME }}" --password-stdin

      - name: Package chart
        run: helm package charts/blob-indexer --version "${{ steps.version.outputs.version }}"

      - name: Push chart to Harbor
        run: helm push blob-indexer-${{ steps.version.outputs.version }}.tgz oci://${REGISTRY}/${{ github.repository_owner }}/charts
