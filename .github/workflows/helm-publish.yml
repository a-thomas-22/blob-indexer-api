name: Helm Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Helm chart version to publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  helm:
    # Only run for chart releases, not app releases
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'blob-indexer-chart-v')
    runs-on: ubuntu-latest
    env:
      REGISTRY: registry.ahkc.win
      REGISTRY_PROJECT: public
    steps:
      - uses: actions/checkout@v7

      - name: Extract version from tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#blob-indexer-chart-v}" >> "$GITHUB_OUTPUT"
          fi

      - uses: azure/setup-helm@v5

      - name: Login to Harbor
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: echo "${REGISTRY_PASSWORD}" | helm registry login "${REGISTRY}" -u "${REGISTRY_USERNAME}" --password-stdin

      - name: Package chart
        run: |
          set -euo pipefail
          app_version="$(jq -r '."."' .release-please-manifest.json)"
          if [ -z "$app_version" ] || [ "$app_version" = "null" ]; then
            echo "::error::.release-please-manifest.json is missing the root app version"
            exit 1
          fi
          helm package charts/blob-indexer \
            --version "${{ steps.version.outputs.version }}" \
            --app-version "${app_version}"

      - name: Push chart to Harbor
        run: helm push blob-indexer-${{ steps.version.outputs.version }}.tgz oci://${REGISTRY}/${REGISTRY_PROJECT}/charts
