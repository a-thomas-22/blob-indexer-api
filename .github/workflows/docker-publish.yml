name: Docker Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: App version to publish, without the v prefix
        required: true
        type: string

permissions:
  contents: read

jobs:
  docker:
    # Only run for app releases, not chart releases
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'blob-indexer-api-v')
    runs-on: ubuntu-latest
    env:
      REGISTRY: registry.ahkc.win
      REGISTRY_PROJECT: public
    strategy:
      matrix:
        include:
          - component: api
            dockerfile: Dockerfile.api
            image_suffix: "-api"
          - component: indexer
            dockerfile: Dockerfile.indexer
            image_suffix: "-indexer"
    steps:
      - uses: actions/checkout@v6

      - name: Extract version from tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#blob-indexer-api-v}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.REGISTRY_PROJECT }}/blob-indexer-api${{ matrix.image_suffix }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }}
            type=raw,value=latest

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
