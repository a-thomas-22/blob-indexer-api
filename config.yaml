database:
  url: "postgres://postgres:postgres@localhost:5432/blobindexer?sslmode=disable"
  run_migrations: true

server:
  port: 8080
  dev_port: 8081
  dev_mode: true
  # Required when dev_mode is true: gates /dev/* (metrics, logs, queries). This
  # is a local-only placeholder — never reuse it for any deployed environment.
  dev_api_key: "local-dev-only-change-me"
  # Real client IP source for rate limiting and the WebSocket per-IP connection
  # caps. Empty by default (falls back to RemoteAddr). Set this to a proxy's
  # client-IP header ONLY when the origin refuses direct, non-proxy ingress —
  # the header is otherwise spoofable. Behind Cloudflare:
  #   trusted_ip_headers:
  #     - CF-Connecting-IP
  trusted_ip_headers: []
  rate_limit_rps: 100
  rate_limit_burst: 200
  aggregate_rate_limit_rps: 5
  aggregate_rate_limit_burst: 20

cors:
  enabled: true
  allowed_origins:
    - "http://localhost:3000"
    - "http://localhost:3001"
    - "http://127.0.0.1:3000"
    - "http://127.0.0.1:3001"
  allowed_origin_patterns: []
  allow_all_origins: false
  allowed_methods:
    - "GET"
    - "OPTIONS"
  allowed_headers:
    - "Accept"
    - "Content-Type"
    - "Authorization"
  exposed_headers:
    - "Content-Length"
    - "ETag"
  allow_credentials: false
  max_age_seconds: 86400

logging:
  level: "info"
  format: "json"

indexer:
  version: "v1.0.0"
  batch_size: 50 # Smaller batch size for more frequent updates
  polling_interval: 5s # Faster polling when not using websockets
  mempool_polling_interval: 15s # Faster mempool polling
  # Fill execution-layer fees onto blob rows indexed before they were stored,
  # refetching each block and updating in place. Resumable; pause throttles RPC use.
  priority_fee_backfill_enabled: true
  priority_fee_backfill_pause: 250ms

attribution:
  blob_list_enabled: true
  blob_list_base_url: "https://github.com/tirante-dev/blob-list/releases/latest/download"
  blob_list_refresh_interval: "1h"
  blob_list_request_timeout: "10s"

websocket:
  poll_interval: 3s
  users_throttle_interval: 30s
  max_clients: 10000 # Global cap on concurrent WebSocket clients (0 = unlimited)
  max_conns_per_ip: 32 # Per-IP cap on concurrent WebSocket connections (0 = unlimited)

networks:
  - name: "mainnet"
    chain_id: 1
    rpc_url: "https://mainnet.infura.io/v3/your-key"
    start_block: "LATEST-1000"
    enabled: true

  - name: "sepolia"
    chain_id: 11155111
    rpc_url: "https://sepolia.infura.io/v3/your-key"
    start_block: "LATEST-100"
    enabled: true
